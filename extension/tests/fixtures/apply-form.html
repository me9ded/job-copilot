<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply — Platform Engineer at Northwind Labs</title></head>
<body>
  <h1>Apply for Platform Engineer</h1>
  <form id="app" action="/submitted" method="post">
    <label for="first_name">First Name *</label><input id="first_name" name="first_name" required>
    <label for="last_name">Last Name *</label><input id="last_name" name="last_name" required>
    <label for="email">Email *</label><input id="email" name="email" type="email" required>
    <label for="phone">Phone</label><input id="phone" name="phone" type="tel">
    <label for="resume">Resume/CV *</label><input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx">
    <label for="sponsor">Will you now or in the future require sponsorship?</label><input id="sponsor" name="sponsor">
    <label for="why">Why do you want to join?</label><textarea id="why" name="why"></textarea>
    <button type="submit">Submit application</button>
  </form>
  <iframe id="extra" src="/apply-frame.html" title="More questions"></iframe>
  <script>
    // Stands in for a framework that only trusts input events (like React's onChange).
    window.seen = {};
    document.addEventListener('input', (e) => { window.seen[e.target.id] = e.target.type === 'file' ? e.target.files[0]?.name : e.target.value; });
    window.submitted = false;
    document.getElementById('app').addEventListener('submit', (e) => { e.preventDefault(); window.submitted = true; });
  </script>
</body>
</html>
