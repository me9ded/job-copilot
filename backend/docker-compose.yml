# SQLite (default):          docker compose up --build
# With PostgreSQL:           docker compose --profile postgres up --build
#   and set DATABASE_URL=postgresql+psycopg://jobcopilot:${POSTGRES_PASSWORD}@db:5432/jobcopilot in .env
services:
  api:
    build: .
    env_file: .env
    ports:
      # Bound to localhost only. Put a TLS reverse proxy in front before exposing it.
      - "127.0.0.1:8787:8787"
    volumes:
      - data:/srv/data
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: jobcopilot
      POSTGRES_DB: jobcopilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  data:
  pg:
